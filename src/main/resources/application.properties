spring.application.name=springweb

# 주석 : .properties 파일의 주석 방법

# application.properties 파일이란? → spring 관련 설정 코드 입력하는 곳

# [1] 내장 톰캣의 포트 번호 변경 가능 (기본값 = 8080)
server.port = 8080

# [2] 데이터베이스 연동

# 2-1: 연동할 DB 주소
# spring.datasource.url=jdbc:mysql://localhost:3306/mydb0902
# spring.datasource.url=jdbc:mysql://localhost:3306/mydb0903
# spring.datasource.url=jdbc:mysql://localhost:3306/practice3
# spring.datasource.url=jdbc:mysql://localhost:3306/practice4
spring.datasource.url=jdbc:mysql://localhost:3306/practice5

# 2-2: DB 주소의 계정명/비밀번호
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# [3]
# 1. 초기화 모드 강제 활성화
spring.sql.init.mode=always

# 2. 샘플 파일 - 경로 앞 슬래시 제거 (src/main/resources/sql/*.sql 위치)
# spring.sql.init.data-locations=classpath:sql/data.sql
# spring.sql.init.data-locations=classpath:sql/practice3.sql
# spring.sql.init.data-locations=classpath:sql/practice4.sql
spring.sql.init.data-locations=classpath:sql/practice5.sql

# 3. Hibernate 테이블 생성 후 스크립트 실행
spring.jpa.defer-datasource-initialization=true

# [DDL] 
# create : 서버 실행됭 때 엔티티 기반으로 테이블 삭제 -> 생성
# create-drop : 서버 실행될 때 엔티티 기반으로 테이블 생성, 서버 종료 시 삭제
# update : 서버 실행될 때 존재하면 엔티티 수정, 없으면 생성
# none : 사용 안함.
spring.jpa.hibernate.ddl-auto=create

# 4. SQL 스크립트 실행 중 에러 발생 시 로그 확인 (선택)
spring.sql.init.continue-on-error=false

# 5. 한글 인코딩
spring.sql.init.encoding=UTF-8