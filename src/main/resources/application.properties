spring.application.name=springweb

# 주석 : .properties 파일의 주석 방법

# application.properties 파일이란? → spring 관련 설정 코드 입력하는 곳

# 1. 내장 톰캣의 포트 번호 변경 가능 (기본값 = 8080)
server.port = 8080

# 2. 데이터베이스 연동
# 2-1: 연동할 DB 주소
# spring.datasource.url=jdbc:mysql://localhost:3306/mydb0902
spring.datasource.url=jdbc:mysql://localhost:3306/mydb0903

# 2-2: DB 주소의 계정명/비밀번호
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. DDL 
# create : 서버 실행됭 때 엔티티 기반으로 테이블 삭제 -> 생성
# create-drop : 서버 실행될 때 엔티티 기반으로 테이블 생성, 서버 종료 시 삭제
# update : 서버 실행될 때 존재하면 엔티티 수정, 없으면 생성
# none : 사용 안함.
spring.jpa.hibernate.ddl-auto=create-drop
# 개발 단계에서는 create-drop 또는 update를 사용
# 실제로는 사용 X

# 4. SQL 콘솔 출력(개발 단계에서만 사용)
spring.jpa.show-sql=true
logging.jpa.properties.hibernate.format_sql=true

# 5. 서버 실행될 때 data.sql (경로)파일 실행
# classpath(resources폴더):
spring.sql.init.data-locations=classpath:/sql/0903.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always